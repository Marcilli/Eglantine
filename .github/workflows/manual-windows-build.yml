name: Manual Windows x64 Build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Commit to build (default: merged PR #567)"
        required: false
        default: "e736dfde9e45bc3640935e373927814883803d95"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2022
    env:
      PLATFORM: windows-x86_64
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja and CMake
        uses: lukka/get-cmake@latest

      - name: Install Qt 6 for MSVC x64
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools
        shell: pwsh
        run: glslangValidator --version

      - name: Configure Release
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DNIGHTLY_BUILD=ON
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Compile
        shell: bash
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          sccache --show-stats

      - name: Package GUI dependencies
        shell: pwsh
        run: |
          foreach ($exe in 'eglantine.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "Missing expected executable: $exe"
            }
          }
          windeployqt --release --no-translations build/release/bin/eglantine.exe

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-windows-x64-pr567-${{ inputs.source_sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 14
